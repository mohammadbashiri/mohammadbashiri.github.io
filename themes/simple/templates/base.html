<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Mohammad Bashiri — machine learning, computational neuroscience, and data-driven medicine.">
    <title>{{ SITENAME }}</title>
    <link rel="icon" type="image/x-icon" href="{{ SITEURL }}/theme/images/website.ico">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
    <script defer src="{{ SITEURL }}/theme/js/main.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="wordmark" href="{{ SITEURL }}/" aria-label="Mohammad Bashiri, home">MB<span class="wordmark-dot">.</span></a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="#about">About</a>
                <a href="#work">Work</a>
                <a href="#updates">Updates</a>
                <a href="#more">More</a>
            </nav>
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle color theme">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            </button>
        </div>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <span>© {{ AUTHOR }} · Made with care.</span>
            <a href="mailto:mohammadbashiri93@gmail.com">Say hello <span aria-hidden="true">↗</span></a>
        </div>
    </footer>
</body>
</html>
