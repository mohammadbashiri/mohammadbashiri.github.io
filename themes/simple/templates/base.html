<!doctype html>
<html lang="en" data-field-palette="{{ FIELD_PALETTE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Mohammad Bashiri — scientific machine learning, applied AI, and tools for human–agent collaboration.">
    <title>{{ SITENAME }}</title>
    <link rel="icon" type="image/x-icon" href="{{ SITEURL }}/theme/images/website.ico">
    <script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) { /* use the dark default */ }</script>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css?v={{ asset_version('css/main.css') }}">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/project-deck.css?v={{ asset_version('css/project-deck.css') }}">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/field-background.css?v={{ asset_version('css/field-background.css') }}">
    <script type="module" src="{{ SITEURL }}/theme/js/field-background.js?v={{ asset_version('js/field-background.js') }}"></script>
    <script defer src="{{ SITEURL }}/theme/js/main.js?v={{ asset_version('js/main.js') }}"></script>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/project-gallery.css?v={{ asset_version('css/project-gallery.css') }}">
    <script defer src="{{ SITEURL }}/theme/js/project-gallery.js?v={{ asset_version('js/project-gallery.js') }}"></script>
</head>
<body id="top">
    <canvas id="living-field" aria-hidden="true" data-engine-version="{{ asset_version('js/field/engine.mjs') }}"></canvas>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="wordmark" href="{{ SITEURL }}/#top" aria-label="Mohammad Bashiri, back to top">MB<span class="wordmark-dot">.</span></a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#work">Research</a>
                <a href="#updates">Timeline</a>
            </nav>
            <button id="field-toggle" type="button" hidden aria-label="Pause and dim background" title="Pause and dim background" aria-pressed="true">
                <svg class="field-pause-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>
                <svg class="field-play-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M9 5.5v13l10-6.5z"/></svg>
            </button>
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle color theme">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            </button>
        </div>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <span>© {{ AUTHOR }} · Made with care.</span>
        </div>
    </footer>
</body>
</html>
